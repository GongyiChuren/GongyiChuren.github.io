      body {
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f6f7fb;

      .admin-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        display: flex;
        align-items: center;
      }

      <div class="links">

    </div>
    <div id="nc-root"></div>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="/admin/decap-cms.js"></script>
    <script>
      window.CMS.init();
    </script>
  </body>
</html>
