backend:
  name: github
  repo: GongyiChuren/myblog
  branch: main
  base_url: https://gongyi-blog.1391197588.workers.dev
  auth_endpoint: /auth

media_folder: "themes/firefly/public/assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: https://gongyichuren.github.io
display_url: https://gongyichuren.github.io

collections:
  - name: "posts"
    label: "文章"
    folder: "themes/firefly/src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "pages"
    label: "页面"
    files:
      - label: "关于我"
        name: "about"
        file: "themes/firefly/src/content/spec/about.md"
        fields:
          - { label: "正文", name: "body", widget: "markdown" }
      - label: "留言板"
        name: "guestbook"
        file: "themes/firefly/src/content/spec/guestbook.md"
        fields:
          - { label: "正文", name: "body", widget: "markdown" }
